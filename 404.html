<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#1f5d42" />
  <title>404 | Desa Wisata Patakbanteng</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background: #17241d;
    }

    .page-404 {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .page-404__bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .page-404::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(9, 21, 15, 0.35),
        rgba(9, 21, 15, 0.55)
      );
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 680px;
      width: 100%;
      padding: 40px 28px;
      border-radius: 28px;
      background: rgba(17, 35, 26, 0.28);
      backdrop-filter: blur(5px);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
    }

    .code {
      font-size: clamp(5rem, 16vw, 10rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.06em;
      text-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.5rem);
      margin-bottom: 10px;
    }

    p {
      font-size: 1rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.92);
      margin-bottom: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      background: #ffffff;
      color: #1f5d42;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.96;
    }
  </style>
</head>
<body>
  <main class="page-404">
    <img
      class="page-404__bg"
      src="assets/images/hero/patakbanteng-hero.jpg"
      alt="Pemandangan Desa Wisata Patakbanteng"
    />

    <div class="content">
      <div class="code">404</div>
      <h1>Halaman tidak ditemukan</h1>
      <a class="btn" href="index.html">Kembali ke Beranda</a>
    </div>
  </main>
</body>
</html>
